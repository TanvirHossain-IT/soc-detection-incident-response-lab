name: Import clean SOC portfolio
on:
  push:
    paths:
      - '.github/workflows/import-clean-portfolio.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract clean project files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from shutil import copyfileobj
          archive = Path("SOC_Home_Lab_Clean_Public_Upload.zip")
          if not archive.is_file():
              raise SystemExit("Clean portfolio ZIP not found")
          allowed = {".md", ".kql", ".xml", ".png"}
          with ZipFile(archive) as z:
              for item in z.infolist():
                  if item.is_dir():
                      continue
                  dest = Path(item.filename)
                  if dest.is_absolute() or ".." in dest.parts:
                      raise RuntimeError("Unsafe archive path")
                  if dest.name == "README.md":
                      continue
                  if dest.suffix not in allowed and dest.name not in {".gitignore", ".gitkeep"}:
                      raise RuntimeError("Unexpected file: " + str(dest))
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(item) as src, dest.open("wb") as out:
                      copyfileobj(src, out)
          archive.unlink()
          PY
      - name: Commit extracted project files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Import organized clean SOC lab portfolio"
            git push
          fi
